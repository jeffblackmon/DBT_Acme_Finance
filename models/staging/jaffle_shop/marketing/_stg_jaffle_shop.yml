version: 2

models:
  - name: stg_jaffle_shop__customers
    description: One record per customer, derived from the raw customers data.
    columns:
      - name: customer_id
        description: Primary key for the customers table.
        tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.

  - name: stg_jaffle_shop__orders
    description: One record per order, derived from the raw orders data.
    columns:
      - name: order_id
        description: Primary key for the orders table.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the customers table.
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      - name: order_date
        description: Date when the order was placed.
      - name: status
        description: Current status of the order.
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

 
